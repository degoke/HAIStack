version: "1"
# Vendor-neutral SMART scope ∩ policy scenarios for HAIStack research Track C.
# Executed by pkg/testkit/authztest (shared runner) and go run ./research/policy-semantics.
# Policy documents, roles, and principals live in this file (portable pkg/auth DSL).
# observation-only grants clinician *.read so SMART user/*.read satisfies
# RequiredPermissions; policy rules still narrow the allowed resource types.
roles:
  - name: clinician
    permissions:
      - appointment.read
      - read-patient-summary
      - read-appointment
      - patient.read
      - observation.read
  - name: tenant-admin
    permissions:
      - module.install
      - read-appointment
      - appointment.read
      - read-patient-summary
  - name: backend
    permissions:
      - "*.read"
      - patient.read
principals:
  clinician:
    id: user-clinician
    kind: user
    tenant: tenant-a
    roles: [clinician]
  admin:
    id: user-admin
    kind: user
    tenant: tenant-a
    roles: [tenant-admin]
  backend:
    id: backend-app
    kind: service
    clientId: backend-app
    tenant: tenant-a
    roles: [backend]
policyRoleGrants:
  observation-only:
    clinician:
      - "*.read"
policies:
  base:
    version: "1"
    rules:
      - name: appointment-rw
        effect: allow
        match:
          actions: [read, write]
          resourceTypes: [Appointment]
          anyPermissions: [appointment.read]
        reason: clinicians may access appointments
      - name: patient-read
        effect: allow
        match:
          actions: [read]
          resourceTypes: [Patient]
          anyPermissions: [patient.read]
        reason: patient read allowed
      - name: patient-summary-view
        effect: allow
        match:
          actions: [execute-view]
          viewNames: [patient_summary_view]
        reason: view allowed
      - name: ai-run-view
        effect: allow
        match:
          actions: [execute-ai-tool]
          toolNames: [run_view]
        reason: ai may run view tool
      - name: patient-access
        effect: allow
        match:
          actions: [patient-access]
        reason: patient compartment access
      - name: device-push
        effect: allow
        match:
          actions: [push-device-event]
          deviceTrusted: true
          deviceStatuses: [active]
        reason: trusted device may push
      - name: install-scheduling
        effect: allow
        match:
          actions: [install-module]
          moduleNames: [scheduling]
          roles: [tenant-admin]
        reason: admin may install scheduling
  observation-only:
    version: "1"
    rules:
      - name: observation-only
        effect: allow
        match:
          actions: [read]
          resourceTypes: [Observation]
          anyPermissions: [observation.read, "*.read"]
        reason: policy allows observation only
      - name: patient-access
        effect: allow
        match:
          actions: [patient-access]
        reason: patient compartment access
  allow-all-read:
    version: "1"
    rules:
      - name: allow-all-read
        effect: allow
        match:
          actions: [read, write, execute-view, execute-ai-tool, patient-access]
        reason: broad policy allows when scopes grant
  deny-first:
    version: "1"
    rules:
      - name: deny-appointment
        effect: deny
        match:
          actions: [read]
          resourceTypes: [Appointment]
        reason: blocked by deny-first rule
      - name: allow-appointment
        effect: allow
        match:
          actions: [read]
          resourceTypes: [Appointment]
          anyPermissions: [appointment.read]
        reason: would allow
scenarios:
  - name: broad_scope_matching_policy_allows_observation
    doc: "Example 1 — user/*.read ∩ observation-only policy allows Observation read."
    principal: clinician
    scopes: user/*.read
    policy: observation-only
    action: read
    resourceType: Observation
    resourceId: obs-1
    expectAllow: true

  - name: broad_scope_narrow_policy_denies_appointment
    doc: "Example 2 — user/*.read ∩ observation-only policy denies Appointment (policy narrowing)."
    principal: clinician
    scopes: user/*.read
    policy: observation-only
    action: read
    resourceType: Appointment
    resourceId: a1
    expectAllow: false

  - name: narrow_scope_broad_policy_denies_observation
    doc: "Example 3 — user/Patient.read ∩ allow-all policy cannot expand missing Observation scope."
    principal: clinician
    scopes: user/Patient.read
    policy: allow-all-read
    action: read
    resourceType: Observation
    resourceId: obs-1
    expectAllow: false

  - name: granular_scope_matching_policy_allows_observation
    doc: "Example 4 — user/Observation.rs ∩ observation-only policy allows Observation read."
    principal: clinician
    scopes: user/Observation.rs
    policy: observation-only
    action: read
    resourceType: Observation
    resourceId: obs-1
    expectAllow: true

  - name: read_scope_denies_write
    doc: "Example 5 — user/Observation.read ∩ allow-all policy still denies Observation write."
    principal: clinician
    scopes: user/Observation.read
    policy: allow-all-read
    action: write
    resourceType: Observation
    resourceId: obs-1
    expectAllow: false

  - name: patient_overlay_allows_own_patient
    doc: "Example 6 — launch/patient user/Patient.read may read Patient/pat-1."
    principal: clinician
    scopes: launch/patient user/Patient.read
    policy: base
    action: read
    resourceType: Patient
    resourceId: pat-1
    patientId: pat-1
    expectAllow: true

  - name: patient_overlay_denies_other_patient
    doc: "Example 7 — same token cannot read Patient/pat-2 (compartment overlay)."
    principal: clinician
    scopes: launch/patient user/Patient.read
    policy: base
    action: read
    resourceType: Patient
    resourceId: pat-2
    patientId: pat-1
    expectAllow: false

  - name: deny_by_default_unmatched_type
    doc: "Example 8 — user/*.read ∩ base policy has no MedicationRequest rule."
    principal: clinician
    scopes: user/*.read
    policy: base
    # Pass the SMART RequiredPermissions gate so deny is unmatched policy, not missing *.read.
    roleGrants:
      clinician: ["*.read"]
    action: read
    resourceType: MedicationRequest
    resourceId: rx-1
    expectAllow: false

  - name: first_match_deny_wins
    doc: "Example 9 — deny-first policy blocks Appointment before a later allow rule."
    principal: clinician
    scopes: user/*.read
    policy: deny-first
    roleGrants:
      clinician: ["*.read"]
    action: read
    resourceType: Appointment
    resourceId: a1
    expectAllow: false

  - name: cross_tenant_denied
    doc: "Example 10 — clinician bound to tenant-a is denied tenant-b."
    principal: clinician
    scopes: user/*.read
    policy: base
    action: read
    resourceType: Patient
    resourceId: pat-1
    tenant: tenant-b
    expectAllow: false

  - name: view_execution_allowed
    doc: "Example 11 — user/*.read ∩ base policy may execute patient_summary_view."
    principal: clinician
    scopes: user/*.read
    policy: base
    # Pass SMART RequiredPermissions (*.read from user/*.read) so allow is policy.
    roleGrants:
      clinician: ["*.read"]
    action: execute-view
    resourceType: Patient
    viewName: patient_summary_view
    expectAllow: true

  - name: ai_run_view_allowed
    doc: "Example 12 — user/*.read ∩ base policy may execute AI tool run_view."
    principal: clinician
    scopes: user/*.read
    policy: base
    roleGrants:
      clinician: ["*.read"]
    action: execute-ai-tool
    resourceType: Observation
    toolName: run_view
    viewName: patient_summary_view
    expectAllow: true

  - name: backend_system_scope_observation_allowed
    doc: "Example 13 — system/*.read service ∩ observation-only allows Observation."
    principal: backend
    scopes: system/*.read
    policy: observation-only
    action: read
    resourceType: Observation
    resourceId: obs-1
    expectAllow: true

  - name: backend_system_scope_appointment_denied
    doc: "Example 14 — system/*.read service ∩ observation-only denies Appointment."
    principal: backend
    scopes: system/*.read
    policy: observation-only
    action: read
    resourceType: Appointment
    resourceId: a1
    expectAllow: false
