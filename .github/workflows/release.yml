name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not a semver version (expected vMAJOR.MINOR.PATCH or a prerelease like v1.2.3-rc.1)"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: $TAG ($GITHUB_SHA) is not on origin/main"
            exit 1
          fi
          echo "Tag $TAG points at $GITHUB_SHA on origin/main"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

      - name: Build CLI release binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ldflags="-s -w -X github.com/degoke/health-ai-stack/cmd/haistack/command.Version=${TAG}"
          for spec in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${spec%/*}"
            arch="${spec#*/}"
            ext=""
            if [ "$os" = windows ]; then
              ext=".exe"
            fi
            out="dist/haistack_${TAG}_${os}_${arch}${ext}"
            echo "Building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/haistack
          done
          (
            cd dist
            sha256sum * > SHA256SUMS
          )
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$TAG" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --title "HAIStack ${TAG}" \
            --generate-notes \
            --verify-tag \
            "${extra[@]}"
