name: Inferno SMART Discovery

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inferno-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Inferno-aligned discovery tests
        run: go test -count=1 -timeout 5m ./pkg/testkit/infernotest/... ./pkg/smart/host/...

      - name: Start inferno-reference host
        run: |
          go run ./cmd/inferno-reference/ -addr :8765 &
          echo $! > /tmp/inferno-ref.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8765/fhir/metadata >/dev/null; then
              echo "inferno-reference is ready"
              exit 0
            fi
            sleep 1
          done
          echo "inferno-reference failed to start"
          exit 1

      - name: Probe SMART well-known endpoint
        run: |
          curl -sf http://localhost:8765/fhir/.well-known/smart-configuration | jq .
          curl -sf http://localhost:8765/fhir/.well-known/smart-configuration | \
            jq -e '.authorization_endpoint and .token_endpoint and (.grant_types_supported | index("authorization_code"))'

      - name: Stop inferno-reference
        if: always()
        run: |
          if [ -f /tmp/inferno-ref.pid ]; then
            kill "$(cat /tmp/inferno-ref.pid)" 2>/dev/null || true
          fi
