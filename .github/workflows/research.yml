name: Research

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Reproducibility checks for research artefacts. Failures fail the PR job.
# The same `make research` target also runs in ci.yml so it is a blocking check.
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Research artefacts
        run: make research
