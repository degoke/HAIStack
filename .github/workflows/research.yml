name: Research

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  research-tests:
    name: Research tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Research package tests
        run: go test -count=1 ./research/...

  research-artefacts:
    name: Research artefacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Published artefact commands
        run: make research-run
