name: Research

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Reproducibility checks
        run: make research
