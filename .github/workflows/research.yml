name: Research

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Reproducibility checks for research artefacts. Not a required status check
# while the suite is bootstrapped (issue #11). Failures are still visible on
# the workflow run.
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Research artefacts
        run: make research
