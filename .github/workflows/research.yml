name: Research

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Reproducibility checks for research artefacts. Failures fail this job.
# The required CI workflow (.github/workflows/ci.yml) also runs `make research`,
# so research failures block the PR whether or not this dedicated check is
# configured in branch protection.
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Research artefacts
        run: make research
