name: Conformance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use the branch ref on main so the lock refresh step can push; a SHA leaves detached HEAD.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: ${{ github.event_name == 'push' && 0 || 2 }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: conformance/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-conformance-${{ hashFiles('conformance-lock.json', 'conformance/package-lock.json') }}

      - name: Install toolchain
        run: npm ci

      - name: Build IG
        working-directory: .
        run: make ig

      - name: Check exported artefacts match FSH
        working-directory: .
        run: |
          git diff --exit-code -- modules/core/ig modules/sdc/ig
          if [[ -n "$(git ls-files --others --exclude-standard -- modules/core/ig modules/sdc/ig)" ]]; then
            echo "untracked IG artefacts; run make ig and commit"
            git status --short -- modules/core/ig modules/sdc/ig
            exit 1
          fi

      - name: Validate examples
        working-directory: .
        run: make validate-ig

      - name: Refresh certification lock on main
        if: github.event_name == 'push'
        working-directory: .
        run: make conformance-lock

      - name: Reject PR gitCommit lock edits
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff "${{ github.event.pull_request.base.sha }}...HEAD" -- conformance-lock.json \
            | grep -E '^[+-].*"gitCommit"'; then
            echo "do not update conformance-lock.json gitCommit in pull requests; main CI refreshes it after merge"
            exit 1
          fi

      - name: Commit refreshed certification lock
        if: github.event_name == 'push'
        working-directory: .
        run: |
          if git diff --quiet -- conformance-lock.json; then
            echo "conformance-lock.json already matches main HEAD"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add conformance-lock.json
          git commit -m "chore: refresh conformance-lock after main conformance build"
          git push origin HEAD:main

      - name: Upload IG artefacts
        uses: actions/upload-artifact@v4
        with:
          name: haistack-ig
          path: |
            conformance/fsh-generated/resources/
            modules/core/ig/
            modules/sdc/ig/
            conformance-lock.json
