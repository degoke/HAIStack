# PRs targeting main: fmt, vet, lint, build, and fast tests (-short, no race).
# Pushes to main (after merge): full suite including race detector and Postgres integration tests.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run 'make fmt' on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Test (fast)
        if: github.event_name == 'pull_request'
        run: go test -short -count=1 -timeout 20m ./...

      - name: Test (full)
        if: github.event_name == 'push'
        run: go test -race -count=1 -timeout 30m ./...

      - name: Build
        run: go build ./...

      - name: Tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Merge-blocking research artefact checks. GitHub branch protection
      # cannot be set from repository files; this step lives in the required
      # `ci` job so research failures fail the existing required check.
      - name: Research artefacts
        run: make research
